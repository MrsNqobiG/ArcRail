# Keyless signing (cosign) and SLSA build provenance for the release artefacts.
#
# Triggers ONLY on a manual run (Actions tab -> release-sign -> Run workflow) and on
# v* tags, never on ordinary pushes: every signature and provenance made here is
# recorded in Sigstore's PUBLIC transparency log (Rekor), and each entry's certificate
# names this private repository, this workflow, the ref and the commit SHA. Artefact
# contents are not uploaded; only their sha256 digests are. See docs/CI.md.
#
# No long-lived keys and no secrets: cosign and the SLSA generator use short-lived
# Fulcio certificates issued against this run's GitHub OIDC token.
#
# Every third-party action is pinned by full commit SHA (tag in the comment), except the
# SLSA reusable workflow, which SLSA requires by tag (see the provenance job). How each
# reference was verified: docs/verification/tooling-phase2.md.
name: release-sign

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Nothing by default; each job grants only what it needs.
permissions: {}

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail: a failure inside a pipe (| tee) fails the step

concurrency:
  group: release-sign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same container, tools and full scripts/ci.sh as ci.yml, then the release artefacts
  # (dist tarball, sbom.cdx.json) and their base64 sha256 subjects.
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release-artifacts: true

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # GitHub OIDC token -> Fulcio short-lived certificate (keyless)
      contents: read
    env:
      # Expected signer: this workflow file at this run's ref. Fixed here, not read back
      # from the certificate, so a bundle signed by any other workflow or ref fails.
      IDENTITY: https://github.com/MrsNqobiG/ArcRail/.github/workflows/release-sign.yml@${{ github.ref }}
      ISSUER: https://token.actions.githubusercontent.com
      SUBJECTS: ${{ needs.build.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release

      - name: Artefacts match the build's SLSA subjects
        working-directory: release
        run: |
          set -euo pipefail
          printf '%s' "$SUBJECTS" | base64 -d > subjects.txt
          cmp subjects.txt SHA256SUMS
          sha256sum -c SHA256SUMS
          rm subjects.txt

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: cosign binary is the published v3.0.6 (cosign_checksums.txt)
        run: |
          set -euo pipefail
          echo "c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74  $(command -v cosign)" | sha256sum -c
          cosign version

      - name: Sign each artefact (keyless, GitHub OIDC; public Rekor entry)
        working-directory: release
        run: |
          set -euo pipefail
          for f in arc-rail-adapter-dist.tar.gz sbom.cdx.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Verify each bundle (pinned identity and issuer; any failure fails the job)
        working-directory: release
        run: |
          set -euo pipefail
          for f in arc-rail-adapter-dist.tar.gz sbom.cdx.json; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" "$f"
          done

      - name: "Self-test: a wrong identity and a tampered artefact must both fail verification"
        working-directory: release
        run: |
          set -euo pipefail
          f=arc-rail-adapter-dist.tar.gz
          if cosign verify-blob --bundle "$f.sigstore.json" \
               --certificate-identity "https://github.com/MrsNqobiG/ArcRail/.github/workflows/ci.yml@$GITHUB_REF" \
               --certificate-oidc-issuer "$ISSUER" "$f"; then
            echo "FAIL: verify-blob accepted a wrong certificate identity"; exit 1
          fi
          cp "$f" "$RUNNER_TEMP/tampered" && printf 'x' >> "$RUNNER_TEMP/tampered"
          if cosign verify-blob --bundle "$f.sigstore.json" \
               --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$RUNNER_TEMP/tampered"; then
            echo "FAIL: verify-blob accepted a tampered artefact"; exit 1
          fi
          echo "self-test ok: wrong identity rejected, tampered artefact rejected"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosign-bundles
          path: release/*.sigstore.json
          if-no-files-found: error
          retention-days: 90

  # SLSA Build L3 provenance from the official generic generator. It is referenced by its
  # full release tag, not a commit SHA, because SLSA requires it: the generators "MUST be
  # referenced by tag in order for the slsa-verifier to be able to verify the ref of the
  # trusted builder/generator's reusable workflow", and as @vX.Y.Z (a shorter tag fails
  # the build). This is a deliberate exception to SHA pinning (slsa-github-generator
  # README, "Referencing SLSA builders and generators"; slsa-verifier issue #12).
  # Compensating check: verify-provenance below accepts only provenance from a trusted
  # generator workflow at a release tag. Tag v2.1.0 resolved to commit
  # f7dd8c54c2067bafc12ca7a55595d5ee9b75204a (docs/verification/tooling-phase2.md).
  provenance:
    needs: build
    permissions:
      actions: read # the generator reads this run's workflow to fill in the provenance
      id-token: write # keyless signing of the provenance (Fulcio, public Rekor entry)
      # The generator's upload-assets job asks for contents: write. GitHub checks a reusable
      # workflow's permissions when the run starts, even for jobs that will be skipped, so
      # this is needed although assets are uploaded only on tag runs.
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: arc-rail.intoto.jsonl
      # This repository is private. Without this flag the generator refuses to run,
      # because the signed provenance goes to Sigstore's PUBLIC transparency log, and
      # with it the repository name, workflow path, ref, commit SHA, run ID and the
      # artefact digests. The operator accepted that by asking for this workflow.
      private-repository: true
      # Attach the provenance to the GitHub release only for tag runs.
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/v') }}

  verify-provenance:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SLSA_VERIFIER_VERSION: v2.7.1
      # slsa-verifier-linux-amd64 v2.7.1: SHA256SUM.md on slsa-verifier main and the
      # GitHub release asset digest agree (docs/verification/tooling-phase2.md).
      SLSA_VERIFIER_SHA256: 946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339
      PROVENANCE: ${{ needs.provenance.outputs.provenance-name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance

      - name: Install slsa-verifier (official release, sha256-checked)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/slsa-verifier" \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/$SLSA_VERIFIER_VERSION/slsa-verifier-linux-amd64"
          echo "$SLSA_VERIFIER_SHA256  $RUNNER_TEMP/slsa-verifier" | sha256sum -c
          chmod +x "$RUNNER_TEMP/slsa-verifier"

      - name: Verify the provenance (source github.com/MrsNqobiG/ArcRail; failure fails the workflow)
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then src=(--source-tag "$GITHUB_REF_NAME"); else src=(--source-branch "$GITHUB_REF_NAME"); fi
          "$RUNNER_TEMP/slsa-verifier" verify-artifact \
            --provenance-path "provenance/$PROVENANCE" \
            --source-uri github.com/MrsNqobiG/ArcRail "${src[@]}" \
            release/arc-rail-adapter-dist.tar.gz release/sbom.cdx.json 2>&1 | tee provenance/verification.txt
          grep -q 'PASSED: SLSA verification passed' provenance/verification.txt

      - name: "Self-test: a wrong source and a tampered artefact must both fail"
        run: |
          set -euo pipefail
          if "$RUNNER_TEMP/slsa-verifier" verify-artifact --provenance-path "provenance/$PROVENANCE" \
               --source-uri github.com/MrsNqobiG/NotArcRail release/sbom.cdx.json; then
            echo "FAIL: slsa-verifier accepted a wrong source repository"; exit 1
          fi
          cp release/sbom.cdx.json "$RUNNER_TEMP/sbom.cdx.json" && printf ' ' >> "$RUNNER_TEMP/sbom.cdx.json"
          if "$RUNNER_TEMP/slsa-verifier" verify-artifact --provenance-path "provenance/$PROVENANCE" \
               --source-uri github.com/MrsNqobiG/ArcRail "$RUNNER_TEMP/sbom.cdx.json"; then
            echo "FAIL: slsa-verifier accepted a tampered artefact"; exit 1
          fi
          echo "self-test ok: wrong source rejected, tampered artefact rejected" | tee -a provenance/verification.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-verification
          path: provenance/
          if-no-files-found: error
          retention-days: 90

  g2-evidence:
    needs: [build, sign, verify-provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: G2 precondition, no skipped stages (cosign and SLSA ran in this workflow)
        run: node tools/g2-precondition.mjs docs/GATES.md | tee "$RUNNER_TEMP/g2-precondition.txt"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: evidence/release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cosign-bundles
          path: evidence/cosign

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-verification
          path: evidence/provenance

      - name: Evidence summary
        env:
          IDENTITY: https://github.com/MrsNqobiG/ArcRail/.github/workflows/release-sign.yml@${{ github.ref }}
          PROVENANCE: arc-rail.intoto.jsonl
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = MrsNqobiG/ArcRail \
            || { echo "FAIL: repository is $GITHUB_REPOSITORY, expected MrsNqobiG/ArcRail (identity and citation are pinned to it)"; exit 1; }
          run_url="https://github.com/MrsNqobiG/ArcRail/actions/runs/$GITHUB_RUN_ID"
          out=evidence/g2-evidence.md
          {
            echo "# G2 evidence: release-sign run $GITHUB_RUN_ID"
            echo
            echo "- Run: $run_url (attempt $GITHUB_RUN_ATTEMPT)"
            echo "- Citation for the G2 row of docs/GATES.md: \`release-sign run $run_url\`"
            echo "- Event: $GITHUB_EVENT_NAME · ref: $GITHUB_REF · commit: $GITHUB_SHA"
            echo "- Jobs: build (full scripts/ci.sh) ok · sign ok · provenance ok · verify-provenance ok"
            echo
            echo "## Artefacts (sha256)"
            echo '```'
            cat evidence/release/SHA256SUMS
            echo '```'
            echo
            echo "## cosign bundles (keyless, verified in the sign job)"
            echo "- Certificate identity: $IDENTITY"
            echo "- OIDC issuer: https://token.actions.githubusercontent.com"
            echo '```'
            (cd evidence/cosign && sha256sum ./*.sigstore.json | sed 's# \./#  #')
            echo '```'
            echo
            echo "## SLSA provenance"
            echo "- File: $PROVENANCE, sha256 $(sha256sum "evidence/provenance/$PROVENANCE" | cut -d' ' -f1)"
            echo "- slsa-verifier v2.7.1, source github.com/MrsNqobiG/ArcRail:"
            echo '```'
            cat evidence/provenance/verification.txt
            echo '```'
            echo
            echo "## G2 precondition"
            echo '```'
            cat "$RUNNER_TEMP/g2-precondition.txt"
            echo '```'
          } > "$out"
          grep -q 'PASSED: SLSA verification passed' evidence/provenance/verification.txt
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
          cat "$out"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g2-evidence
          path: evidence/g2-evidence.md
          if-no-files-found: error
          retention-days: 90
