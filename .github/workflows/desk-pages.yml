# Public demo (desk/): build the static site and publish it to the gh-pages branch,
# which GitHub Pages serves at https://mrsnqobig.github.io/ArcRail/.
# Runs when desk/ changes on main, or by hand (Actions → desk-pages → Run workflow) on main only.
# The site holds no keys; visitors' testnet keys are made and kept in their own browser (desk/README.md).
#
# Least privilege: the build job (which runs third-party npm packages) gets a read-only
# token. Only the publish job can write, and it runs no npm code: it downloads the built
# files and pushes them to gh-pages. Actions are pinned by full commit SHA, reusing the
# pins already verified in ci.yml and release-sign.yml (docs/verification/tooling-phase2.md).
name: desk-pages

on:
  push:
    branches: [main]
    paths: ['desk/**', '.github/workflows/desk-pages.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: desk-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: desk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Install (exact lockfile, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high

      - name: Typecheck and build
        run: npm run build

      - name: Guard (no chain/custody libraries, no external loads)
        run: npm run check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desk-site
          path: desk/dist
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the built files to the gh-pages branch
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desk-site
          path: site

      - name: Push to gh-pages
        shell: bash
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish desk demo from ${SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
