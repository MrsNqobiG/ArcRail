# Public demo (desk/): build the static site and publish it to the gh-pages branch,
# which GitHub Pages serves at https://mrsnqobig.github.io/ArcRail/.
# Runs when desk/ changes on main, or by hand (Actions → desk-pages → Run workflow).
# The demo holds no keys and broadcasts nothing (desk/README.md).
# Actions are pinned by full commit SHA, the same pins as ci.yml.
name: desk-pages

on:
  push:
    branches: [main]
    paths: ['desk/**', '.github/workflows/desk-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desk-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: desk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Install (exact lockfile, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

      - name: Publish dist to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish desk demo from ${SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
